<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YMH219 - TCP/IP Canlı Chat Platformu (Web & Mobil)</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 10px;
      background: #090d16; color: #f8fafc;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .container {
      max-width: 1000px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 10px;
      min-height: calc(100vh - 20px);
    }
    header {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .header-info h1 { margin: 0; font-size: 18px; color: #38bdf8; font-weight: 800; }
    .header-info p { margin: 3px 0 0 0; font-size: 12px; color: #94a3b8; }
    .status-badge {
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
      background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .status-badge.connecting { background: rgba(245, 158, 11, 0.2); color: #facc15; border-color: #f59e0b; }
    .status-badge.offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: #ef4444; }

    /* Üst Ayar Çubuğu */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px;
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 10px; align-items: center;
    }
    .form-group {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    }
    .input {
      background: #020617; border: 1px solid #475569; border-radius: 6px;
      padding: 6px 10px; color: #fff; font-size: 12.5px; outline: none;
    }
    .input:focus { border-color: #38bdf8; }
    .btn {
      border: none; border-radius: 6px; padding: 7px 13px;
      font-size: 12.5px; font-weight: 700; color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-connect { background: #10b981; }
    .btn-disconnect { background: #ef4444; }
    .btn-share { background: #0284c7; }
    .btn-save { background: #d97706; }
    .btn-sound { background: #475569; }

    /* Ana Izgara */
    .grid {
      display: grid; grid-template-columns: 1fr 270px;
      gap: 10px; flex: 1;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .chat-box {
      flex: 1; min-height: 400px; max-height: 520px;
      background: #020617; border-radius: 8px; padding: 12px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }

    /* Mesaj Balonları */
    .msg {
      padding: 8px 12px; border-radius: 8px; max-width: 80%;
      word-break: break-word; font-size: 13.5px; line-height: 1.4;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .msg-system {
      align-self: center; background: rgba(30, 41, 59, 0.8);
      color: #94a3b8; font-size: 11.5px; border-radius: 14px;
      padding: 4px 12px; border: 1px solid #334155;
    }
    .msg-public {
      align-self: flex-start; background: #1e293b;
      border-left: 3px solid #38bdf8;
    }
    .msg-self {
      align-self: flex-end; background: #0369a1;
      border-right: 3px solid #38bdf8;
    }
    .msg-private {
      align-self: flex-start; background: #4c1d95;
      border-left: 3px solid #facc15;
    }
    .msg-private-self {
      align-self: flex-end; background: #581c87;
      border-right: 3px solid #facc15;
    }
    .msg-meta {
      font-size: 11px; color: #94a3b8; margin-bottom: 3px;
      display: flex; gap: 6px; align-items: center;
    }
    .msg-self .msg-meta { color: #bae6fd; justify-content: flex-end; }
    .msg-badge {
      background: #d97706; color: #fff; font-size: 9.5px;
      padding: 1px 5px; border-radius: 4px; font-weight: 700;
    }

    /* Kullanıcı Listesi */
    .user-list {
      display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; max-height: 420px;
    }
    .user-item {
      padding: 8px 10px; background: #0f172a; border-radius: 6px;
      font-size: 12.5px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; border: 1px solid transparent;
    }
    .user-item:hover { border-color: #38bdf8; }
    .user-item.self { background: #082f49; }

    /* Mesaj Gönderme Çubuğu */
    .send-bar {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .send-input {
      flex: 1; background: #020617; border: 1px solid #475569;
      border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none;
    }
    .send-input:focus { border-color: #38bdf8; }
    .btn-send {
      background: #0284c7; padding: 10px 22px; font-size: 13.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-info">
        <h1>YMH219 — Canlı Çevrimiçi Chat Platformu (Gerçek Zamanlı)</h1>
        <p>Nesne Tabanlı Programlama 3. Ödev · Öğrenci: <b>Emine Zehra Duyar (250541027)</b></p>
      </div>
      <div id="status-badge" class="status-badge connecting">
        <span id="status-dot">●</span> <span id="status-text">Sunucuya Bağlanıyor...</span>
      </div>
    </header>

    <!-- Toolbar: İsim, Oda, Davet Linki, Ses, Kaydet -->
    <div class="toolbar">
      <div class="form-group">
        <span>👤 Adınız:</span>
        <input type="text" id="username-input" class="input" value="" style="width:115px;" placeholder="Adınız..." />
      </div>

      <div class="form-group">
        <span>🔑 Oda:</span>
        <input type="text" id="room-input" class="input" value="genel" style="width:90px;" />
        <button id="btn-change-room" class="btn btn-connect" style="padding:6px 10px;">Katıl</button>
      </div>

      <button id="btn-share-room" class="btn btn-share">🔗 Arkadaşını Davet Et</button>
      <button id="btn-save" class="btn btn-save">💾 Sohbeti Kaydet (.txt)</button>
      <button id="btn-sound" class="btn btn-sound">🔊</button>
      <button id="btn-toggle" class="btn btn-disconnect" style="margin-left:auto;">Bağlantıyı Kes</button>
    </div>

    <!-- Ana Sohbet ve Kullanıcı Alanı -->
    <div class="grid">
      <!-- Sol: Mesajlaşma Alanı -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0; font-size:14px; color:#38bdf8;">
            Canlı Sohbet Akışı (<span id="room-title">Oda: genel</span>)
          </h3>
          <span style="font-size:11.5px; color:#94a3b8;">
            Özel mesaj için kullanıcı adına tıklayın veya <code>@Kişi Mesaj</code> yazın.
          </span>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="send-bar">
          <input type="text" id="msg-input" class="send-input" placeholder="Mesajınızı yazın (Enter ile gönder)..." autocomplete="off" />
          <button id="btn-send" class="btn btn-send">Gönder</button>
        </div>
      </div>

      <!-- Sağ: Çevrimiçi Kullanıcılar -->
      <div class="card">
        <h3 style="margin:0; font-size:14px; color:#facc15;">
          Çevrimiçi Kişiler (<span id="user-count">1</span>)
        </h3>
        <div id="user-list" class="user-list"></div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       YMH219 - Gerçek Zamanlı Bulut Chat Motoru (MQTT over WebSockets)
       Öğrenci: Emine Zehra Duyar (250541027)
       Özellikler: Global Gerçek Zamanlı Mesajlaşma, Özel Mesaj (@kullanıcı),
       Canlı Çevrimiçi Listesi, Oda Kodları, Davet Linki, Web Audio Bildirimi
       ========================================================================== */

    // URL'den oda parametresini al (?oda=zehra gibi)
    const urlParams = new URLSearchParams(window.location.search);
    let currentRoom = (urlParams.get('oda') || 'genel').trim().toLowerCase();

    // Rastgele veya saklanan isim
    let myName = localStorage.getItem('ymh219_chat_name');
    if (!myName) {
      myName = 'Zehra_' + Math.floor(Math.random() * 899 + 100);
      localStorage.setItem('ymh219_chat_name', myName);
    }
    const myId = 'uid_' + Math.random().toString(36).substring(2, 9);

    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const roomTitle = document.getElementById('room-title');
    const chatBox = document.getElementById('chat-box');
    const userList = document.getElementById('user-list');
    const userCount = document.getElementById('user-count');
    const msgInput = document.getElementById('msg-input');
    const btnSend = document.getElementById('btn-send');
    const btnToggle = document.getElementById('btn-toggle');
    const btnChangeRoom = document.getElementById('btn-change-room');
    const btnShareRoom = document.getElementById('btn-share-room');
    const btnSave = document.getElementById('btn-save');
    const btnSound = document.getElementById('btn-sound');
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');

    usernameInput.value = myName;
    roomInput.value = currentRoom;
    roomTitle.innerText = `Oda: ${currentRoom}`;

    // --- Web Audio API Bildirim Sesi ---
    let soundEnabled = true;
    let audioCtx = null;
    function playChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    btnSound.onclick = () => {
      soundEnabled = !soundEnabled;
      btnSound.innerText = soundEnabled ? '🔊' : '🔇';
    };

    // --- Çevrimiçi Kullanıcı Takibi (Presence Heartbeat) ---
    const onlineUsers = new Map(); // id -> { name, lastSeen }
    onlineUsers.set(myId, { name: myName, lastSeen: Date.now() });

    function refreshUsersUI() {
      const now = Date.now();
      // 25 saniyeden eski olanları düşür
      for (const [id, u] of onlineUsers.entries()) {
        if (id !== myId && now - u.lastSeen > 25000) {
          onlineUsers.delete(id);
        }
      }

      userCount.innerText = onlineUsers.size;
      userList.innerHTML = Array.from(onlineUsers.entries()).map(([id, u]) => {
        const isSelf = id === myId;
        return `
          <div class="user-item ${isSelf ? 'self' : ''}" onclick="tagUser('${u.name}')" title="Özel mesaj atmak için tıklayın">
            <span>🟢 <b>${u.name}</b> ${isSelf ? '<span style="font-size:11px; color:#38bdf8;">(Sen)</span>' : ''}</span>
            <span style="font-size:11px; color:#94a3b8;">Çevrimiçi</span>
          </div>
        `;
      }).join('');
    }

    window.tagUser = function(name) {
      if (name === myName) return;
      msgInput.value = `@${name} ` + msgInput.value.replace(/^@\S+\s*/, '');
      msgInput.focus();
    };

    // --- Mesaj Listesi ve Ekrana Basma ---
    const messages = [];

    function addMessageToUI(msg) {
      messages.push(msg);
      const isSelf = msg.senderId === myId;
      const isPrivate = msg.type === 'private';
      let cls = 'msg-public';
      if (msg.type === 'system') cls = 'msg-system';
      else if (isPrivate) cls = isSelf ? 'msg-private-self' : 'msg-private';
      else if (isSelf) cls = 'msg-self';

      const timeStr = msg.time || new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const div = document.createElement('div');
      div.className = `msg ${cls}`;

      if (msg.type === 'system') {
        div.innerHTML = `ℹ️ [${timeStr}] ${msg.text}`;
      } else {
        div.innerHTML = `
          <div class="msg-meta">
            <b>${msg.sender}</b> · ${timeStr}
            ${isPrivate ? `<span class="msg-badge">ÖZEL (${msg.target})</span>` : ''}
          </div>
          <div>${escapeHtml(msg.text)}</div>
        `;
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (!isSelf && msg.type !== 'system') {
        playChime();
      }
    }

    function escapeHtml(text) {
      const p = document.createElement('p');
      p.textContent = text;
      return p.innerHTML;
    }

    // --- Canlı Bulut MQTT İletişim Motoru ---
    let client = null;
    let isConnected = false;
    let heartbeatInterval = null;

    // Yedekli genel MQTT broker adresleri (HiveMQ + EMQX)
    const brokers = [
      'wss://broker.hivemq.com:8884/mqtt',
      'wss://broker.emqx.io:8084/mqtt'
    ];
    let brokerIndex = 0;

    function getTopic(room) {
      return `ymh219_ntp_chat/${room}`;
    }

    function connectToBroker() {
      if (client) {
        try { client.end(true); } catch(e) {}
      }

      statusBadge.className = 'status-badge connecting';
      statusText.innerText = 'Bulut Sunucusuna Bağlanıyor...';

      const brokerUrl = brokers[brokerIndex];
      const clientId = 'web_' + myId;

      try {
        client = mqtt.connect(brokerUrl, {
          clientId: clientId,
          clean: true,
          connectTimeout: 7000,
          reconnectPeriod: 4000
        });

        client.on('connect', () => {
          isConnected = true;
          statusBadge.className = 'status-badge';
          statusText.innerText = `● ÇEVRİMİÇİ (Oda: ${currentRoom})`;
          btnToggle.innerText = 'Bağlantıyı Kes';
          btnToggle.className = 'btn btn-disconnect';

          const topic = getTopic(currentRoom);
          client.subscribe(topic, { qos: 0 }, (err) => {
            if (!err) {
              // Katılma bildirimi
              publishEvent('system', `${myName} sohbete katıldı.`);
              publishHeartbeat();
            }
          });

          // Düzenli kalp atışı (Presence)
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(publishHeartbeat, 10000);
        });

        client.on('message', (topic, payload) => {
          try {
            const data = JSON.parse(payload.toString());
            handleIncomingPacket(data);
          } catch(e) {}
        });

        client.on('close', () => {
          isConnected = false;
          statusBadge.className = 'status-badge offline';
          statusText.innerText = '■ BAĞLANTI KESİLDİ';
          btnToggle.innerText = 'Yeniden Bağlan';
          btnToggle.className = 'btn btn-connect';
        });

        client.on('error', (err) => {
          console.warn('Broker hatası:', err);
          // Sıradaki brokere geç
          brokerIndex = (brokerIndex + 1) % brokers.length;
        });

      } catch (err) {
        console.error('MQTT başlatılamadı:', err);
      }
    }

    function publishHeartbeat() {
      if (!client || !isConnected) return;
      const packet = {
        kind: 'presence',
        senderId: myId,
        sender: myName,
        time: Date.now()
      };
      client.publish(getTopic(currentRoom), JSON.stringify(packet));
    }

    function publishEvent(type, text, target = null) {
      if (!client || !isConnected) return;
      const now = new Date();
      const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const packet = {
        kind: 'message',
        type: type,
        senderId: myId,
        sender: myName,
        text: text,
        target: target,
        time: timeStr
      };
      client.publish(getTopic(currentRoom), JSON.stringify(packet));
    }

    function handleIncomingPacket(data) {
      if (data.kind === 'presence') {
        onlineUsers.set(data.senderId, { name: data.sender, lastSeen: Date.now() });
        refreshUsersUI();
        return;
      }

      if (data.kind === 'message') {
        // Özel mesaj kontrolü: Yalnızca alıcı veya gönderen görebilir
        if (data.type === 'private') {
          const isForMe = data.target === myName;
          const isFromMe = data.senderId === myId;
          if (!isForMe && !isFromMe) return; // Başkasına ait özel mesaj, yoksay
        }
        addMessageToUI(data);
      }
    }

    // --- Mesaj Gönderme ---
    function handleSend() {
      const text = msgInput.value.trim();
      if (!text || !isConnected) return;

      if (text.startsWith('@')) {
        const parts = text.slice(1).split(' ');
        const target = parts[0];
        const content = parts.slice(1).join(' ').trim();
        if (!content) {
          alert('Lütfen özel mesaj içeriğini yazın (Örn: @Ahmet Merhaba)');
          return;
        }
        publishEvent('private', content, target);
      } else {
        publishEvent('public', text);
      }

      msgInput.value = '';
      msgInput.focus();
    }

    btnSend.onclick = handleSend;
    msgInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };

    // --- Oda Değiştirme ---
    btnChangeRoom.onclick = () => {
      const newRoom = roomInput.value.trim().toLowerCase();
      if (!newRoom || newRoom === currentRoom) return;

      if (client && isConnected) {
        publishEvent('system', `${myName} bu odadan ayrıldı.`);
        client.unsubscribe(getTopic(currentRoom));
      }

      currentRoom = newRoom;
      roomTitle.innerText = `Oda: ${currentRoom}`;
      chatBox.innerHTML = '';
      onlineUsers.clear();
      onlineUsers.set(myId, { name: myName, lastSeen: Date.now() });
      refreshUsersUI();

      // Yeni odaya abone ol
      client.subscribe(getTopic(currentRoom), () => {
        publishEvent('system', `${myName} odaya katıldı.`);
        publishHeartbeat();
      });
      statusText.innerText = `● ÇEVRİMİÇİ (Oda: ${currentRoom})`;
    };

    // --- İsim Güncelleme ---
    usernameInput.onchange = () => {
      const newName = usernameInput.value.trim();
      if (!newName || newName === myName) return;
      const oldName = myName;
      myName = newName;
      localStorage.setItem('ymh219_chat_name', myName);
      onlineUsers.set(myId, { name: myName, lastSeen: Date.now() });
      refreshUsersUI();
      publishEvent('system', `${oldName} adını "${newName}" olarak değiştirdi.`);
    };

    // --- Bağlantı Kes / Yeniden Bağlan ---
    btnToggle.onclick = () => {
      if (isConnected) {
        publishEvent('system', `${myName} bağlantıyı kesti.`);
        client.end();
      } else {
        connectToBroker();
      }
    };

    // --- Arkadaşını Davet Et (Link Kopyala) ---
    btnShareRoom.onclick = () => {
      const inviteUrl = `${window.location.origin}${window.location.pathname}?oda=${encodeURIComponent(currentRoom)}`;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert(`Oda Bağlantısı Kopyalandı! 📋\n\nArkadaşınıza bu linki gönderin:\n${inviteUrl}\n\nArkadaşınız tıkladığında doğrudan sizin odanıza bağlanacaktır.`);
      }).catch(() => {
        prompt("Arkadaşınıza bu linki gönderin:", inviteUrl);
      });
    };

    // --- Sohbet Geçmişini .txt Olarak İndir ---
    btnSave.onclick = () => {
      if (messages.length === 0) return alert('Kaydedilecek mesaj yok!');
      const content = messages.map(m => {
        if (m.type === 'system') return `[${m.time}] [SİSTEM] ${m.text}`;
        if (m.type === 'private') return `[${m.time}] [ÖZEL -> ${m.target}] ${m.sender}: ${m.text}`;
        return `[${m.time}] [GENEL] ${m.sender}: ${m.text}`;
      }).join('\n');

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sohbet_gecmisi_${currentRoom}.txt`;
      a.click();
    };

    // Başlangıç Bağlantısı
    refreshUsersUI();
    connectToBroker();
  </script>
</body>
</html>
