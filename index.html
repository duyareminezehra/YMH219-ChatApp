<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YMH219 - TCP/IP Chat Uygulaması (Web & Mobil)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      background: #0f172a; color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .container { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    h1 { margin: 0; font-size: 18px; color: #38bdf8; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #16a34a; color: #fff; }
    .badge.offline { background: #64748b; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; background: #1e293b; padding: 10px; border-radius: 8px; align-items: center;
    }
    .input {
      background: #020617; border: 1px solid #475569; border-radius: 6px; padding: 7px 10px; color: #fff; font-size: 13px;
    }
    .btn { border: none; border-radius: 6px; padding: 7px 14px; font-weight: 700; color: #fff; cursor: pointer; }
    .btn-connect { background: #16a34a; }
    .btn-disconnect { background: #dc2626; }
    .btn-save { background: #d97706; }
    .grid { display: grid; grid-template-columns: 1fr 260px; gap: 12px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-box {
      height: 380px; background: #020617; border-radius: 6px; padding: 10px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px;
    }
    .msg { padding: 6px 10px; border-radius: 6px; max-width: 85%; }
    .msg-system { align-self: center; background: #1e293b; color: #94a3b8; font-size: 11.5px; border-radius: 12px; padding: 3px 10px; }
    .msg-public { align-self: flex-start; background: #1e293b; border-left: 3px solid #38bdf8; }
    .msg-self { align-self: flex-end; background: #0369a1; }
    .msg-private { align-self: flex-start; background: #4c1d95; border-left: 3px solid #facc15; }
    .user-item { padding: 6px 8px; background: #0f172a; border-radius: 4px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>YMH219 — TCP/IP İstemci-Sunucu Chat Uygulaması</h1>
        <div style="font-size:12.5px; color:#94a3b8;">Nesne Tabanlı Programlama 3. Ödev · <b>Emine Zehra Duyar (250541027)</b></div>
      </div>
      <div id="status-badge" class="badge">● SUNUCU AKTİF (127.0.0.1:8989)</div>
    </header>

    <div class="toolbar">
      <span>Kullanıcı Adı:</span>
      <input type="text" id="username-input" class="input" value="Zehra" style="width:110px;" />
      <button id="btn-toggle" class="btn btn-disconnect">Bağlantıyı Kes</button>
      <button id="btn-save" class="btn btn-save">💾 Sohbeti Kaydet (.txt)</button>
      <span style="font-size:12px; color:#94a3b8; margin-left:auto;">Özel Mesaj: <code>@Ahmet mesaj</code></span>
    </div>

    <div class="grid">
      <div class="card">
        <h3 style="margin:0; font-size:14px; color:#38bdf8;">Canlı Sohbet Akışı (ChatMessage)</h3>
        <div id="chat-box" class="chat-box"></div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="msg-input" class="input" style="flex:1;" placeholder="Mesajınızı yazın (Örn: Selam veya @Ahmet Merhaba)..." />
          <button id="btn-send" class="btn btn-connect" style="padding:7px 20px;">Gönder</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0; font-size:14px; color:#facc15;">Bağlı İstemciler (ConnectedClients)</h3>
        <div id="users-box" style="display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:380px;"></div>
      </div>
    </div>
  </div>

  <script>
    let isConnected = true;
    let myName = 'Zehra';
    const users = ['Zehra (Sen)', 'Ahmet_Kaya', 'Elif_Demir', 'Mehmet_Ozturk'];
    const messages = [];

    const chatBox = document.getElementById('chat-box');
    const usersBox = document.getElementById('users-box');
    const usernameInput = document.getElementById('username-input');
    const msgInput = document.getElementById('msg-input');
    const btnToggle = document.getElementById('btn-toggle');
    const statusBadge = document.getElementById('status-badge');

    function addMessage(type, sender, text) {
      const now = new Date();
      const time = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      messages.push({ type, sender, text, time });
      renderChat();
    }

    function renderChat() {
      chatBox.innerHTML = messages.map(m => {
        if (m.type === 'system') {
          return `<div class="msg msg-system">[${m.time}] ℹ️ ${m.text}</div>`;
        }
        const isSelf = m.sender === myName;
        const cls = m.type === 'private' ? 'msg-private' : (isSelf ? 'msg-self' : 'msg-public');
        return `
          <div class="msg ${cls}">
            <div style="font-size:11px; color:#94a3b8; margin-bottom:2px;">
              <b>${m.sender}</b> · ${m.time} ${m.type === 'private' ? '<span style="color:#facc15;">[ÖZEL MESAJ]</span>' : ''}
            </div>
            <div>${m.text}</div>
          </div>
        `;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderUsers() {
      usersBox.innerHTML = users.map(u => `
        <div class="user-item">
          <span>🟢 <b>${u}</b></span>
          <span style="font-size:11px; color:#94a3b8;">127.0.0.1</span>
        </div>
      `).join('');
    }

    // Başlangıç mesajları
    addMessage('system', 'Sunucu', 'TCP/IP Chat Sunucusu 127.0.0.1:8989 portunda başlatıldı.');
    addMessage('system', 'Sunucu', 'Zehra sunucuya katıldı.');
    addMessage('public', 'Ahmet_Kaya', 'Merhaba arkadaşlar, proje ödevinde hangi aşamadasınız?');
    addMessage('public', 'Elif_Demir', 'Selamlar! Flappy Bird ve KeyLogger tamamlandı.');

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !isConnected) return;

      if (text.startsWith('@')) {
        const parts = text.slice(1).split(' ');
        const target = parts[0];
        const content = parts.slice(1).join(' ');
        addMessage('private', myName, `(Kime: ${target}) ${content}`);
      } else {
        addMessage('public', myName, text);
      }
      msgInput.value = '';

      // Otomatik yanıt simülasyonu
      setTimeout(() => {
        if (!isConnected) return;
        if (text.toLowerCase().includes('selam') || text.toLowerCase().includes('merhaba')) {
          addMessage('public', 'Mehmet_Ozturk', 'Hoş geldin Zehra! Projeler harika ilerliyor.');
        }
      }, 1000);
    }

    document.getElementById('btn-send').onclick = sendMessage;
    msgInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

    btnToggle.onclick = () => {
      isConnected = !isConnected;
      if (isConnected) {
        myName = usernameInput.value.trim() || 'Zehra';
        btnToggle.innerText = 'Bağlantıyı Kes';
        btnToggle.className = 'btn btn-disconnect';
        statusBadge.innerText = '● BAĞLANDI (127.0.0.1:8989)';
        statusBadge.className = 'badge';
        addMessage('system', 'Sunucu', `${myName} sohbete tekrar bağlandı.`);
      } else {
        btnToggle.innerText = 'Yeniden Bağlan';
        btnToggle.className = 'btn btn-connect';
        statusBadge.innerText = '■ BAĞLANTI KESİLDİ';
        statusBadge.className = 'badge offline';
        addMessage('system', 'Sunucu', `${myName} bağlantıyı kesti.`);
      }
    };

    document.getElementById('btn-save').onclick = () => {
      const text = messages.map(m => `[${m.time}] [${m.type.toUpperCase()}] ${m.sender}: ${m.text}`).join('\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sohbet_gecmisi.txt';
      a.click();
    };

    renderUsers();
  </script>
</body>
</html>
